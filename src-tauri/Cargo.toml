[package]
name = "horalix-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Horalix Web desktop browser"
build = "build.rs"

[lib]
name = "horalix_web_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "horalix-web"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
horalix-net = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2.11.0", features = ["devtools", "unstable"] }
url = { workspace = true }
